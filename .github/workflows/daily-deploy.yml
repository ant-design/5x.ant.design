name: Daily Deploy

on:
  schedule:
    # Run daily at 00:00 UTC (8:00 AM Beijing Time)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for upstream changes
        id: check
        run: |
          # Get the latest commit hash from ant-design 5.x-stable branch
          LATEST_COMMIT=$(git ls-remote https://github.com/ant-design/ant-design.git refs/heads/5.x-stable | cut -f1)
          echo "Latest commit: $LATEST_COMMIT"
          
          # Try to get the last deployed commit hash from gh-pages branch
          LAST_COMMIT=""
          if git ls-remote --exit-code origin refs/heads/gh-pages > /dev/null 2>&1; then
            echo "gh-pages branch exists, checking for deployment marker"
            if git fetch origin gh-pages:gh-pages 2>/dev/null; then
              LAST_COMMIT=$(git show gh-pages:.deploy-commit 2>/dev/null || echo "")
            fi
          else
            echo "gh-pages branch does not exist yet"
          fi
          
          echo "Last deployed commit: ${LAST_COMMIT:-none}"
          
          # If commits are different or no previous deployment, we need to deploy
          if [ "$LATEST_COMMIT" != "$LAST_COMMIT" ] || [ -z "$LAST_COMMIT" ]; then
            echo "Changes detected, deploying..."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$LATEST_COMMIT" > .deploy-commit
          else
            echo "No changes detected, skipping deployment"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - uses: utooland/setup-utoo@v1
        if: steps.check.outputs.has_changes == 'true'

      - name: Install dependencies
        if: steps.check.outputs.has_changes == 'true'
        run: npm i

      - name: Build and deploy
        if: steps.check.outputs.has_changes == 'true'
        run: npm run build -- --skip-clean

      - name: Save deployment marker
        if: steps.check.outputs.has_changes == 'true'
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if gh-pages branch exists
          if git ls-remote --exit-code origin refs/heads/gh-pages > /dev/null 2>&1; then
            echo "Updating existing gh-pages branch"
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
          else
            echo "Creating new gh-pages branch"
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          
          # Copy and commit the deployment marker
          cp .deploy-commit ./ 2>/dev/null || echo "Marker file not found, skipping"
          if [ -f .deploy-commit ]; then
            git add .deploy-commit
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update deployment marker"
              git push origin gh-pages
            fi
          fi

      - name: Sync to Gitee
        if: steps.check.outputs.has_changes == 'true'
        uses: wearerequired/git-mirror-action@v1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        with:
          source-repo: 'https://github.com/ant-design/5x.ant.design.git'
          destination-repo: 'git@gitee.com:ant-design/5x.ant.design.git'
